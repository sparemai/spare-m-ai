name: Bootstrap SPARE-M-AI source

on:
  workflow_dispatch:
  push:
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and extract source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/sparem-source.b64
          base64 -d /tmp/sparem-source.b64 > /tmp/sparem-source.tar.gz
          tar -xzf /tmp/sparem-source.tar.gz
          test -f cloud/package.json
          test -f cloud/schema.sql
          test -f windows/start-collector.ps1
          rm -rf .bootstrap
          rm -f bootstrap.b64
          rm -f .github/workflows/bootstrap.yml

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add SPARE-M-AI v0.5 source"
          git push
